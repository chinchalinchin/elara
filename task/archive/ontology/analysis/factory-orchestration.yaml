  ticket: 
    # -------------------------------------------
    title: "Ontology: Factory & Orchestration Refactor"
    # -------------------------------------------
    content: |
      Analyze the Factory and Orchestration packages. It seems like it should be possible to use the Factory pattern for Pydantic state models and re-leverage the Asset recipes, instead of instantiating the state models through a messy loop.

      Discuss how to architect a more Pythonic, elegant way of instantiating the Asset states DTOs and transferring them to the POPO Asset states.
