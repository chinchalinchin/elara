task:
# ------------------------------------------------
  context: false
# ------------------------------------------------
  system: null
# ------------------------------------------------
  ticket: 
    # -------------------------------------------
    title: "Ontology - Console"
    # -------------------------------------------
    content: |

    # -------------------------------------------
    shell: 
      # 1. Asset State
      - cat /home/grant/Projects/ontology/src/data/mappings/main.yaml
      - cat /home/grant/Projects/ontology/src/data/equipment/main.yaml
      # 2. Asset Configurations
      - cat /home/grant/Projects/ontology/src/assets/main.yaml
      - cat /home/grant/Projects/ontology/src/assets/sheets/main.yaml
      # 3. State Files
      - ls /home/grant/Projects/ontology/src/data/state/world-01
      - cat /home/grant/Projects/ontology/src/data/state/world-01/tiles.yaml
      - cat /home/grant/Projects/ontology/src/data/state/world-01/player.yaml  
      # 4. Compile Cython
      - python setup.py build_ext --inplace
      # 5. Render Background
      - python /home/grant/Projects/ontology/src/cli.py prerender world-01 --layer '0' --out /home/grant/Projects/ontology/build
      # 6. Render Stateful Assets
      - python /home/grant/Projects/ontology/src/cli.py render world-01 --layer '0' --out /home/grant/Projects/ontology/build
# ------------------------------------------------
  tools:
    # -------------------------------------------
    github: 
      - parameters:
          repo: ontology
          group: chinchalinchin
          board: 
            phase: <phase>
            action: <action>
        views:
          directory: true
          board: true
          docs: true
          python: true
          ontology/app/main: false
          ontology/app/config: true
          ontology/app/models: true
          ontology/app/hooks: true
          ontology/app/game: true
          ontology/app/assets: true
          ontology/libs/core: false
          ontology/libs/graphics: false
          ontology/schemas/assets: false
          ontology/schemas/intents: false
          ontology/schemas/items: false
          ontology/schemas/player: false