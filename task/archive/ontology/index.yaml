task:
# ------------------------------------------------
  context: true
# ------------------------------------------------
  system: null
# ------------------------------------------------
  ticket: 
    # -------------------------------------------
    title: "Ontology: <title>"
    # -------------------------------------------
    content: |
      <content>
    # -------------------------------------------
    shell:
      ## INITIAL CONDITIONS
      # 1. Configuration Files
      - cat /home/grant/Projects/ontology/src/data/config/actions/main.yaml
      - cat /home/grant/Projects/ontology/src/data/config/intentions/main.yaml
      - cat /home/grant/Projects/ontology/src/data/config/recipes/main.yaml
      - cat /home/grant/Projects/ontology/src/data/config/mappings/main.yaml
      # 2. Property Files
      - cat /home/grant/Projects/ontology/src/assets/sheets/main.yaml
      # 3. State Files
      - ls /home/grant/Projects/ontology/src/data/state/world-01
      - cat /home/grant/Projects/ontology/src/data/state/world-01/tiles.yaml
      - cat /home/grant/Projects/ontology/src/data/state/world-01/player.yaml  
      ## EXECUTION
      # 1. Render Background
      - python /home/grant/Projects/ontology/src/cli.py prerender world-01 --layer '0' --out /home/grant/Projects/ontology/build
      # 2. Render Stateful Assets
      - python /home/grant/Projects/ontology/src/cli.py render world-01 --layer '0' --out /home/grant/Projects/ontology/build/ --layer '0' --out /home/grant/Projects/ontology/build
# ------------------------------------------------
  tools:
    # -------------------------------------------
    github: 
      - parameters:
          repo: ontology
          group: chinchalinchin
          board: 
            phase: ii-iii
            action: refactor
        views:
          directory: true
          board: true
          docs: true
          python: false
          ontology/main: true
          ontology/app/assets: true
          ontology/app/config: true
          ontology/app/game: true
          ontology/app/hooks: true
          ontology/app/models: true
          ontology/libs/core: false
          ontology/libs/graphics: true
          ontology/schemas/assets: false
          ontology/schemas/intentions: false
          ontology/schemas/mappings: false
          ontology/schemas/menus: false