  ticket: 
    # -------------------------------------------
    title: "Ontology: Groom"
    # -------------------------------------------
    content: |
      Discuss the design and architecture of this application with respect to the current phase of the Task Board. Do not implement anything; instead step back and examine the big picture. Focus on the logical flow of the application. Suggest improvements, if applicable. Discuss what needs modified in the task backlog, if changes are required. Ensure tasking aligns with architecture. Break everything down, step-by-step.
      
      Treat code as ground truth, but recognize the application is development and this ground truth will evolve over time. Documentation is an ideal that may not yet be implemented in the code (or it may have been modified to accomodate the realities of code execution); it serves a design document. It should be respected and consulted for the general direction of the project, but not always enforced. Because the application is currently in development, the documentation may touch on areas that have not yet been implemented. Documentation is in flux while design occurs, so it is open for debate, if something is inconsistent or contradictory. Assist in elaborating the nebulous or vague concepts in the documentation.

      In addition, look over the codebase for errors, type mismatches and logical problems. Now is the time to find bugs. 

      **Grooming Guidelines**

      - Create or modify tasks in the Task Board to achieve the next Phase of the application. Lay out, step-by-step, what must be done.
      - (*Optional*) Suggest updates to the Documentation to solidify the architecture and design of the application.

      **Other Notes**

      - Keep in mind, this is a 2D game engine that is cropping pre-rendered assets on the fly, not rendering fully-textured ray-traced 3D graphics from scratch. 
      - Do not suggest C-level optimizations at this stage of the application.
      - Do not worry about Python GIL locks yet, unless concerns are severe.
    # -------------------------------------------
    shell: []
      # - python /home/grant/Projects/ontology/src/cli.py start world-01
